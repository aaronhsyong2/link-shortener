<!DOCTYPE html>
<html class="h-full">
<head>
  <title>Unprocessable request (422) — LinkShortener</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9fafb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card { text-align: center; max-width: 28rem; padding: 3rem 2rem; }
    .code { font-size: 5rem; font-weight: 800; color: #f59e0b; line-height: 1; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1rem; }
    p { color: #6b7280; margin-top: 0.5rem; font-size: 0.95rem; }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      background: #2563eb;
      color: #fff;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    a:hover { background: #1d4ed8; }

    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      .code { color: #fbbf24; }
      h1 { color: #f9fafb; }
      p { color: #9ca3af; }
      a { background: #3b82f6; }
      a:hover { background: #2563eb; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">422</div>
    <h1>Unprocessable request</h1>
    <p>Your request couldn't be processed. Please check your input and try again.</p>
    <a href="/">Go home</a>
  </div>
</body>
</html>
