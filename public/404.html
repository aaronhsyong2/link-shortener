<!DOCTYPE html>
<html class="h-full">
<head>
  <title>Page not found (404) — LinkShortener</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { text-align: center; max-width: 28rem; padding: 3rem 2rem; }
    .code { font-size: 5rem; font-weight: 800; color: #2563eb; line-height: 1; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #111827; margin-top: 1rem; }
    p { color: #6b7280; margin-top: 0.5rem; font-size: 0.95rem; }
    a { display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.5rem; background: #2563eb; color: #fff; border-radius: 0.5rem; text-decoration: none; font-size: 0.875rem; font-weight: 500; }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The short URL you're looking for doesn't exist or may have been removed.</p>
    <a href="/">Shorten a URL</a>
  </div>
</body>
</html>
